name: Build release firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    container: debian:13
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git python3 cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib zip
      - uses: actions/checkout@v4
      - name: Fetch Pico SDK 2.2.0
        run: |
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init lib/tinyusb
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"
      - name: Build and package all firmware variants
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: murmulator-release
          path: build/release/murmulator-v*.zip
          if-no-files-found: error
          compression-level: 0
